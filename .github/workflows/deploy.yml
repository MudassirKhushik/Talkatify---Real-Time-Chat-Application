- uses: webfactory/ssh-agent@v0.9.0
  with:
    ssh-private-key: ${{ secrets.SSH_KEY }}

- name: Deploy
  run: |
    ssh -o StrictHostKeyChecking=no root@${{ secrets.HOST }} "
      cd ~/Talkatify---Real-Time-Chat-Application &&
      git pull origin main &&
      docker-compose down &&
      docker-compose up -d --build
    "



